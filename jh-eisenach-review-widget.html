<!--
  JH Eisenach: Google review widget for a Gmail signature

  IMAGES: the logo and the Google "G" are hosted with GitHub Pages from the public
  repository github.com/sumrizeventure/jh-eisenach-signature. Do not delete,
  rename or make that repository private, or the images disappear from every
  email already sent. To change an image, replace the file there under the same name.

  HOW TO INSTALL
  1. Open this file in Google Chrome (double-click it, or drag it into a Chrome window).
  2. Do NOT click on the card itself (it is a link). Just press Ctrl+A, then Ctrl+C
     (on a Mac: Cmd+A, then Cmd+C).
  3. In Gmail open: gear icon > See all settings > General > Signature > Create new.
  4. Click into the signature editor, press Ctrl+V (Cmd+V), scroll to the bottom of
     the page and click "Save Changes".
  5. Optional: under "Signature defaults" pick it for new emails and replies.

  Note: every row of the card is its own full-width link with the padding inside it,
  so the whole card, edges included, opens the review page. Gmail's editor would
  break a single link wrapped around a table. The 100% width is set with the
  width="100%" attribute on purpose: Chrome turns CSS percentages into fixed
  pixels when copying, which would break the mobile layout.
-->
